<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Dashboard · Python Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#13233A; --muted:#5B6B82; --line:#D7DFEB;
  --blue:#306998; --blue-d:#1E4870; --blue-l:#E4EEF7; --yellow:#FFD43B; --yellow-l:#FFF6D1;
  --green:#4FA83D; --green-l:#E5F4E1;
  --sans:"Bricolage Grotesque",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.45 var(--sans)}
.wrap{max-width:1560px;margin:0 auto;padding:18px 24px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:clamp(30px,4vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1}
h1 .py{font-family:var(--mono);color:var(--blue);font-size:.6em;vertical-align:.3em;margin-right:8px}
.live{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
.dot.off{background:#C8463D;animation:none}
@keyframes pulse{50%{opacity:.3}}
select{font:500 16px var(--sans);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.demo{font:700 13px var(--mono);background:var(--yellow);color:var(--ink);border-radius:6px;padding:4px 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
h2{font-size:24px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
.banner{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:17px;display:none}
.banner b{color:var(--yellow)}

/* pipeline hero */
.hero{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:1100px){.hero{grid-template-columns:auto 1fr}}
.score b{display:block;font:700 clamp(54px,7vw,96px)/1 var(--mono);letter-spacing:-.04em;color:var(--blue-d)}
.score span{color:var(--muted);font-size:17px}
.score .eng{margin-top:14px;font:700 26px var(--mono)}
.score .eng small{font:500 15px var(--sans);color:var(--muted);display:block}
.pipe{display:flex;align-items:flex-start;padding-top:8px}
.wire{flex:1;height:8px;background:var(--line);border-radius:8px;position:relative;overflow:hidden;margin-top:30px}
.wire i{position:absolute;inset:0;width:0;background:var(--green);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.stage{width:190px;flex:0 0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:68px;height:68px;border-radius:50%;border:5px solid var(--line);background:#fff;display:grid;place-items:center;font:700 26px var(--mono);color:var(--line);transition:all .5s}
.stage.on .node{background:var(--green);border-color:var(--green);color:#fff}
.stage.on.pop .node{animation:pop 1.1s}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.stage .nm{font:700 17px var(--mono);color:var(--muted)}
.stage.on .nm{color:var(--green)}
.stage .goal{font:500 14px var(--mono);color:var(--muted)}
.stage .rw{font-size:14px;line-height:1.3;color:var(--ink);max-width:180px}
.stage .need{font-size:13px;color:#8A6A00;background:var(--yellow-l);border-radius:6px;padding:2px 8px}
.nextline{margin-top:14px;font-size:20px;font-weight:700}
@media(max-width:760px){.stage{width:auto;flex:1 1 0}.node{width:46px;height:46px;font-size:18px;border-width:4px}.stage .rw,.stage .need{display:none}.stage .nm{font-size:13px}.wire{flex:0 0 10px;margin-top:20px}}

.grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:1100px){.cols{grid-template-columns:1.1fr 1fr 1fr}}
.leads{display:grid;gap:10px}
.lead{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:12px;padding:12px 14px}
.lead .n{font:700 28px var(--mono);color:var(--blue);width:36px}
.lead:first-child .n{color:#B58900}
.lead .who{flex:1}
.lead .who b{font-size:22px;display:block;line-height:1.1}
.lv{display:inline-block;font:700 13px var(--mono);border-radius:6px;padding:2px 7px;background:var(--blue-l);color:var(--blue-d)}
.lv.l5,.lv.l6{background:var(--green-l);color:#2D6A22}
.lv.l7{background:var(--yellow);color:var(--ink)}
.lead .p{font:700 24px var(--mono);color:var(--blue-d)}
.race .row{display:grid;grid-template-columns:92px 1fr 70px;gap:10px;align-items:center;margin:12px 0}
.race .lab{font:700 18px var(--mono)}
.race .bar{height:24px;background:var(--paper);border-radius:8px;overflow:hidden}
.race .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width 1s}
.race .row.top .bar i{background:var(--green)}
.race .v{text-align:right;font:700 18px var(--mono)}
.race .note{font-size:13px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:17px}
.feed li:last-child{border-bottom:none}
.feed li .plus{font:700 17px var(--mono);color:var(--green);white-space:nowrap}
.feed li.mentor .plus{color:var(--blue)}
.feed li.new{animation:flash 2.6s}
@keyframes flash{0%,40%{background:var(--yellow-l)}100%{background:transparent}}
.empty{color:var(--muted);font-size:16px}
.mentors{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mchip{background:var(--blue-l);color:var(--blue-d);border-radius:8px;padding:6px 10px;font-weight:700;font-size:16px}
.mchip span{font:500 13px var(--mono);margin-left:6px}
.roster{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.tile .nm{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:17px}
.tile .nm span{font:700 15px var(--mono);color:var(--blue-d)}
.tile .sub{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px}
.tile.ready{border-style:dashed;background:transparent}
.tile.ready .nm span{font:500 13px var(--sans);color:var(--muted)}
.tile.flash{animation:flash 2.6s}
.perHead{font:700 18px var(--mono);color:var(--blue);margin:14px 0 8px}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-260%);background:var(--ink);color:#fff;font-weight:800;font-size:26px;padding:14px 26px;border-radius:14px;transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:20;text-align:center}
.toast small{display:block;font:500 15px var(--mono);color:var(--yellow)}
.toast.show{transform:translate(-50%,0)}
.err{background:#FBEAEA;border:1px solid #C8463D;color:#7A1F1A;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="py">&gt;&gt;&gt;</span>Build Dashboard</h1>
    <div class="live">
      <span class="demo" id="demoTag" hidden>DEMO</span>
      <select id="periodSel" aria-label="Show period"><option value="ALL">All periods</option></select>
      <span class="dot" id="dot"></span><span id="updated">Loading</span>
    </div>
  </header>

  <div class="err" id="err"></div>
  <div class="banner" id="banner"></div>

  <section class="panel">
    <div class="hero">
      <div class="score">
        <b id="pts">0</b><span id="ptsLbl">points this sprint</span>
        <div class="eng"><span id="onboard">0 / 0</span><small>engineers committed this week</small></div>
      </div>
      <div>
        <div class="pipe" id="pipe"></div>
        <div class="nextline" id="nextline"></div>
      </div>
    </div>
  </section>

  <div class="grid cols">
    <section class="panel">
      <h2>Tech Leads this sprint</h2>
      <div class="leads" id="leads"></div>
    </section>
    <section class="panel" id="raceBox">
      <h2>Sprint race</h2>
      <div class="race" id="race"></div>
      <h2 style="margin-top:18px">Mentors this week</h2>
      <div class="mentors" id="mentors"></div>
    </section>
    <section class="panel">
      <h2>Just committed</h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </div>

  <section class="panel" style="margin-top:16px">
    <h2>Every engineer</h2>
    <div id="roster"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="sprint-data.js"></script>
<script>
const DEMO = !SPRINT.BOARD_CSV_URL;
const params = new URLSearchParams(location.search);
let period = params.get("period") ? cleanPer(params.get("period")) : "ALL";
let ROWS=[], ROSTER=[], ALL=null, seenEvents=null, lastUnlocked=null, toastQ=[], toastBusy=false;
document.getElementById("demoTag").hidden=!DEMO;

function showToast(big, small){ toastQ.push([big,small]); if(!toastBusy) nextToast(); }
function nextToast(){
  const t=document.getElementById("toast"), m=toastQ.shift(); if(!m){ toastBusy=false; return; }
  toastBusy=true; t.innerHTML=`${esc(m[0])}${m[1]?`<small>${esc(m[1])}</small>`:""}`; t.classList.add("show");
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(nextToast,500); },3000);
}

async function load(){
  try{
    if(DEMO){ if(!ROWS.length){ const d=demoData(); ROWS=d.rows; ROSTER=loadRoster(d.rosterRows); } }
    else { ROWS=await getCSV(SPRINT.BOARD_CSV_URL); ROSTER=SPRINT.ROSTER_CSV_URL?loadRoster(await getCSV(SPRINT.ROSTER_CSV_URL)):[]; }
    ALL=computeAll(ROWS, ROSTER);
    document.getElementById("err").style.display="none";
    document.getElementById("dot").classList.remove("off");
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    render();
  }catch(e){
    const el=document.getElementById("err"); el.style.display="block";
    el.textContent="Can't reach the turn-in sheet. Check that the Board tab is published to the web as CSV. Trying again in "+SPRINT.REFRESH_SECONDS+" seconds.";
    document.getElementById("dot").classList.add("off");
  }
}

function fillPeriods(){
  const sel=document.getElementById("periodSel"), pers=periodsOf(ALL);
  if(sel.options.length!==pers.length+1){
    sel.innerHTML=`<option value="ALL">All periods</option>`+pers.map(p=>`<option value="${esc(p)}">Period ${esc(p)}</option>`).join("");
  }
  sel.value=period;
}

function render(){
  fillPeriods();
  const sp=sprintFor(ALL, period);
  const inView = s => period==="ALL" || s.per===period;

  /* hero */
  document.getElementById("pts").textContent=sp.pts.toLocaleString();
  document.getElementById("ptsLbl").textContent = period==="ALL" ? "points this sprint, all periods" : `Period ${period} points this sprint`;
  document.getElementById("onboard").textContent=`${sp.onBoard} / ${sp.size}`;
  const unlockedNow=sp.tiers.filter(t=>t.unlocked).map(t=>t.key);
  const newly = lastUnlocked ? unlockedNow.filter(k=>!lastUnlocked.includes(k)) : [];
  let html="", prev=0;
  sp.tiers.forEach((T,i)=>{
    const seg=Math.max(0,Math.min(1,(sp.pts-prev)/(T.goal-prev)));
    html+=`<div class="wire"><i style="width:${seg*100}%"></i></div>`;
    html+=`<div class="stage ${T.unlocked?"on":""} ${newly.includes(T.key)?"pop":""}">
      <div class="node">${T.unlocked?"✓":i+1}</div><div class="nm">${esc(T.name)}</div>
      <div class="goal">${T.goal.toLocaleString()} pts</div><div class="rw">${esc(T.reward)}</div>
      ${T.everyone?`<div class="need">needs every engineer</div>`:""}</div>`;
    prev=T.goal;
  });
  document.getElementById("pipe").innerHTML=html;
  newly.forEach(k=>{ const T=sp.tiers.find(t=>t.key===k); showToast(`${period==="ALL"?"The class":"Period "+period} hit ${T.name}!`, T.reward); });
  lastUnlocked=unlockedNow;
  const next=sp.tiers.find(t=>!t.unlocked);
  let msg="Deployed. Every reward unlocked this sprint.";
  if(next) msg = !next.ptsOk ? `${(next.goal-sp.pts).toLocaleString()} points to ${next.name}` : `Points hit! ${sp.size-sp.onBoard} engineers still need a commit to ship ${next.name}.`;
  if(sp.days<5) msg += ` (${sp.days}-day week, goals scaled down)`;
  document.getElementById("nextline").textContent=msg;

  /* last week's winner banner */
  const pers=periodsOf(ALL);
  const banner=document.getElementById("banner");
  if(pers.length>1){
    const lw=pers.map(p=>{ const l=ALL.students.filter(s=>s.per===p); return [p, l.reduce((t,s)=>t+s.lastWeek,0)/Math.max(1,l.length)]; }).sort((a,b)=>b[1]-a[1]);
    if(lw[0][1]>0){ banner.style.display="block"; banner.innerHTML=`Last sprint's winner: <b>Period ${esc(lw[0][0])}</b> with ${Math.round(lw[0][1])} points per engineer.`; }
  } else banner.style.display="none";

  /* tech leads */
  const ranked=sp.list.filter(s=>s.week>0).sort((a,b)=>b.week-a.week||b.total-a.total);
  document.getElementById("leads").innerHTML = ranked.length ? ranked.slice(0,period==="ALL"?5:3).map((s,i)=>`
    <div class="lead"><div class="n">${i+1}</div><div class="who"><b>${esc(s.name)}</b>
      <span class="lv l${s.level.lv}">L${s.level.lv} ${esc(s.level.title)}</span>${period==="ALL"?` <span style="color:var(--muted);font-size:14px">P${esc(s.per)}</span>`:""}</div>
      <div class="p">${s.week.toLocaleString()}</div></div>`).join("")
    : `<p class="empty">No commits yet this sprint. First one in gets the top spot.</p>`;

  /* race: points per engineer, so period size doesn't matter */
  const raceBox=document.getElementById("raceBox");
  if(pers.length>1){
    const rs=pers.map(p=>{ const s=sprintFor(ALL,p); return [p, Math.round(s.pts/Math.max(1,s.size))]; });
    const max=Math.max(1,...rs.map(r=>r[1])), top=rs.reduce((a,b)=>b[1]>a[1]?b:a)[0];
    document.getElementById("race").innerHTML=rs.map(([p,v])=>`<div class="row ${p===top&&v>0?"top":""}"><div class="lab">P${esc(p)}<span style="display:block;font:500 12px var(--mono);color:var(--muted)">on ${esc(currentLessonFor(p))}</span></div><div class="bar"><i style="width:${v/max*100}%"></i></div><div class="v">${v}</div></div>`).join("")+`<div class="note">Points per engineer this sprint</div>`;
  } else document.getElementById("race").innerHTML=`<p class="empty">Race shows when more than one period is on the board.</p>`;

  /* mentors */
  const ms=ALL.students.filter(s=>inView(s)&&s.mentorWeek>0).sort((a,b)=>b.mentorWeek-a.mentorWeek);
  document.getElementById("mentors").innerHTML = ms.length ? ms.slice(0,12).map(s=>`<span class="mchip">${esc(s.name)}<span>×${s.mentorWeek}</span></span>`).join("")
    : `<p class="empty">Help a classmate and get named in the Commit form to show up here.</p>`;

  /* feed + level-up toasts */
  const ev=ALL.events.filter(e=>inView(e));
  const keyOf=e=>+e.t+"|"+e.id+"|"+e.act+"|"+e.type;
  const fresh = seenEvents ? ev.filter(e=>!seenEvents.has(keyOf(e))) : [];
  seenEvents=new Set(ALL.events.map(keyOf));
  fresh.filter(e=>e.levelUp).forEach(e=>{ const L=LEVELS[e.levelUp-1]; showToast(`${e.name} leveled up!`, `L${L.lv} ${L.title}`); });
  const freshKeys=new Set(fresh.map(keyOf)), freshIds=new Set(fresh.map(e=>e.id));
  const last=ev.slice(-9).reverse();
  document.getElementById("feed").innerHTML = last.length ? last.map(e=>`<li class="${e.type} ${freshKeys.has(keyOf(e))?"new":""}">
      <span><b>${esc(e.name)}</b> ${e.type==="mentor"?`helped ${esc(e.act)}`:`shipped ${esc(e.kind==="standup"?"the Daily Standup":e.act)}`}</span>
      <span class="plus">+${e.pts}</span></li>`).join("")
    : `<li class="empty">Waiting for the first commit.</li>`;

  /* every engineer */
  const groups=new Map();
  sp.list.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{ if(!groups.has(s.per)) groups.set(s.per,[]); groups.get(s.per).push(s); });
  const keys=[...groups.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  document.getElementById("roster").innerHTML=keys.map(k=>`${keys.length>1?`<div class="perHead">Period ${esc(k)}</div>`:""}<div class="roster">${groups.get(k).map(s=>`
    <div class="tile ${s.week?"":"ready"} ${freshIds.has(s.id)?"flash":""}">
      <div class="nm">${esc(s.name)}<span>${s.week?s.week.toLocaleString():"Ready to ship"}</span></div>
      <div class="sub"><span class="lv l${s.level.lv}">L${s.level.lv}</span>${esc(s.level.title)}</div>
    </div>`).join("")}</div>`).join("");
}

document.getElementById("periodSel").onchange=e=>{
  period=e.target.value; lastUnlocked=null;
  const u=new URL(location); if(period==="ALL") u.searchParams.delete("period"); else u.searchParams.set("period",period); history.replaceState(null,"",u);
  render();
};

/* Demo: a fake commit every few seconds so you can watch the board move */
function demoTick(){
  if(!ALL) return;
  const pool=ALL.students.filter(s=>period==="ALL"||s.per===period);
  const s=pool[Math.floor(Math.random()*pool.length)];
  const next=ACTS.find(a=>a.k!=="standup" && !s.done.has(a.n) && LESSONS.findIndex(L=>L.id===a.lesson)<=LESSONS.findIndex(L=>L.id===currentLessonFor(s.per))+1);
  if(!next) return;
  const mates=pool.filter(x=>x.per===s.per&&x.id!==s.id);
  const helper=Math.random()<.3&&mates.length?mates[Math.floor(Math.random()*mates.length)].name:"";
  ROWS.push([new Date().toISOString(), s.name, s.per, next.n, "Pass", helper]);
  ALL=computeAll(ROWS, ROSTER); render();
  document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
}

load();
if(DEMO) setInterval(demoTick, 4000); else setInterval(load, SPRINT.REFRESH_SECONDS*1000);
</script>
</body>
</html>
