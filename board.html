<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Dashboard · Python Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1B2E; --bg2:#16263F; --bg3:#1D3152; --edge:#2B4570; --shadow:#08111F;
  --ink:#EEF4FF; --muted:#93A8C9; --blue:#4B8BBE; --yellow:#FFD43B; --green:#5BD15B; --red:#FF6B6B;
  --pixel:"Pixelify Sans","Rubik",system-ui,sans-serif; --sans:"Rubik",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:18px/1.45 var(--sans);background:var(--bg);
  background-image:linear-gradient(rgba(75,139,190,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(75,139,190,.07) 1px,transparent 1px);background-size:32px 32px;min-height:100vh}
.wrap{max-width:1560px;margin:0 auto;padding:18px 24px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font:700 clamp(34px,4.4vw,58px)/1 var(--pixel);color:var(--yellow);text-shadow:0 4px 0 var(--shadow)}
h1 .py{color:var(--blue);margin-right:10px}
.live{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite}
.dot.off{background:var(--red);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.3}}
select{font:500 16px var(--sans);padding:8px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--bg3);color:var(--ink)}
.demo{font:700 13px var(--mono);background:var(--yellow);color:#1A1400;border-radius:6px;padding:4px 8px}
.panel{background:var(--bg2);border:2px solid var(--edge);border-radius:16px;padding:20px 22px;box-shadow:0 6px 0 var(--shadow)}
h2{font:800 26px var(--sans);margin:0 0 14px;letter-spacing:-.01em}
.banner{background:var(--bg3);border:2px solid var(--yellow);border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:18px;display:none}
.banner b{color:var(--yellow)}

/* hero: sprint checkpoints */
.hero{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:1100px){.hero{grid-template-columns:auto 1fr}}
.score b{display:block;font:800 clamp(56px,7vw,100px)/1 var(--mono);letter-spacing:-.03em;color:var(--yellow);text-shadow:0 5px 0 var(--shadow)}
.score span{color:var(--muted);font-size:17px}
.score .eng{margin-top:16px;font:800 28px var(--mono);color:var(--green)}
.score .eng small{font:500 15px var(--sans);color:var(--muted);display:block}
.pipe{display:flex;align-items:flex-start;padding-top:12px}
.wire{flex:1;height:12px;background:var(--bg3);border:2px solid var(--edge);border-radius:8px;position:relative;overflow:hidden;margin-top:32px}
.wire i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#7BE87B,var(--green));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.stage{width:190px;flex:0 0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:64px;height:64px;border-radius:14px;transform:rotate(45deg);border:4px solid var(--edge);background:var(--bg3);display:grid;place-items:center;margin:6px 0 10px;transition:all .5s}
.node span{transform:rotate(-45deg);font:800 26px var(--mono);color:var(--muted)}
.stage.on .node{background:var(--green);border-color:#9BF59B;box-shadow:0 0 28px rgba(91,209,91,.7)}
.stage.on .node span{color:#0B2A0B}
.stage.on.pop .node{animation:pop 1.1s}
@keyframes pop{0%{transform:rotate(45deg) scale(.5)}60%{transform:rotate(45deg) scale(1.25)}100%{transform:rotate(45deg) scale(1)}}
.stage .nm{font:700 20px var(--pixel);color:var(--muted)}
.stage.on .nm{color:var(--green)}
.stage .goal{font:700 14px var(--mono);color:var(--muted)}
.stage .rw{font-size:14px;line-height:1.3;max-width:180px}
.stage .need{font-size:13px;color:#1A1400;background:var(--yellow);border-radius:6px;padding:2px 8px;font-weight:700}
.nextline{margin-top:16px;font:800 24px var(--sans);color:var(--yellow)}
@media(max-width:760px){.stage{width:auto;flex:1 1 0}.node{width:42px;height:42px;border-width:3px}.node span{font-size:16px}.stage .rw,.stage .need{display:none}.stage .nm{font-size:14px}.wire{flex:0 0 10px;margin-top:22px}}

.grid{display:grid;gap:18px;margin-top:18px}
@media(min-width:1100px){.cols{grid-template-columns:1.1fr 1fr 1fr}}
.leads{display:grid;gap:10px}
.lead{display:flex;align-items:center;gap:14px;background:var(--bg3);border:2px solid var(--edge);border-radius:12px;padding:10px 14px}
.lead.first{border-color:var(--yellow);background:linear-gradient(90deg,rgba(255,212,59,.16),var(--bg3) 70%)}
.lead .n{font:800 24px var(--mono);color:var(--muted);width:42px;text-align:center}
.lead .n.medal{font-size:32px}
.lead .who{flex:1}
.lead .who b{font-size:22px;display:block;line-height:1.15}
.lv{display:inline-block;font:700 13px var(--mono);border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--blue);border:1px solid var(--edge)}
.lv.l4,.lv.l5,.lv.l6{color:var(--green)}
.lv.l7{background:var(--yellow);color:#1A1400;border-color:var(--yellow)}
.lead .p{font:800 24px var(--mono);color:var(--yellow)}
.race .row{display:grid;grid-template-columns:92px 1fr 70px;gap:10px;align-items:center;margin:12px 0}
.race .lab{font:800 20px var(--mono)}
.race .bar{height:26px;background:var(--bg3);border:2px solid var(--edge);border-radius:8px;overflow:hidden}
.race .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width 1s}
.race .row.top .bar i{background:linear-gradient(180deg,#7BE87B,var(--green))}
.race .v{text-align:right;font:800 20px var(--mono)}
.race .note{font-size:13px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:12px 14px;background:var(--shadow);border-radius:10px;font-family:var(--mono);font-size:15px;min-height:120px}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px dashed #1E2F4A}
.feed li:last-child{border-bottom:none}
.feed li::before{content:">";color:var(--green);margin-right:4px}
.feed li span:first-child{flex:1}
.feed li b{color:var(--ink)}
.feed li{color:var(--muted)}
.feed li .plus{font-weight:800;color:var(--green);white-space:nowrap}
.feed li.mentor .plus{color:var(--blue)}
.feed li.new{animation:flash 2.6s}
@keyframes flash{0%,40%{background:rgba(255,212,59,.22)}100%{background:transparent}}
.empty{color:var(--muted);font-size:16px}
.mentors{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mchip{background:var(--bg3);border:2px solid var(--blue);color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:700;font-size:16px}
.mchip span{font:700 13px var(--mono);margin-left:6px;color:var(--blue)}
.roster{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{display:flex;gap:10px;align-items:center;border:2px solid var(--edge);border-radius:12px;padding:8px 12px;background:var(--bg3)}
.tile .hx{width:38px;height:42px;flex:0 0 38px;display:grid;place-items:center;background:var(--blue);color:#fff;font:800 14px var(--mono);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tile .hx.l4,.tile .hx.l5,.tile .hx.l6{background:var(--green);color:#0B2A0B}
.tile .hx.l7{background:var(--yellow);color:#1A1400}
.tile .tx{flex:1;min-width:0}
.tile .nm{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:17px}
.tile .nm span{font:800 15px var(--mono);color:var(--yellow)}
.tile .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.ready{border-style:dashed;background:transparent}
.tile.ready .sub{color:var(--yellow)}
.tile.flash{animation:flash 2.6s}
.perHead{font:800 20px var(--sans);color:var(--blue);margin:16px 0 8px}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-260%);background:var(--yellow);color:#1A1400;font:700 34px var(--pixel);padding:14px 30px;border-radius:14px;box-shadow:0 6px 0 #B8930F;transition:transform .45s cubic-bezier(.2,.9,.3,1.3);z-index:20;text-align:center}
.toast small{display:block;font:700 16px var(--mono);color:#5A4600;margin-top:2px}
.toast.show{transform:translate(-50%,0)}
.err{background:rgba(255,107,107,.12);border:2px solid var(--red);color:#FFD5D5;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="py">&gt;&gt;&gt;</span>Build Dashboard</h1>
    <div class="live">
      <span class="demo" id="demoTag" hidden>DEMO</span>
      <select id="periodSel" aria-label="Show period"></select>
      <span class="dot" id="dot"></span><span id="updated">Loading</span>
    </div>
  </header>

  <div class="err" id="err"></div>
  <div class="banner" id="banner"></div>

  <section class="panel">
    <div class="hero">
      <div class="score">
        <b id="pts">0</b><span id="ptsLbl">points this sprint</span>
        <div class="eng"><span id="onboard">0 / 0</span><small>engineers committed this week</small></div>
      </div>
      <div>
        <div class="pipe" id="pipe"></div>
        <div class="nextline" id="nextline"></div>
      </div>
    </div>
  </section>

  <div class="grid cols">
    <section class="panel">
      <h2>Tech Leads this sprint</h2>
      <div class="leads" id="leads"></div>
    </section>
    <section class="panel" id="raceBox">
      <h2>Sprint race</h2>
      <div class="race" id="race"></div>
      <h2 style="margin-top:18px">Mentors this week</h2>
      <div class="mentors" id="mentors"></div>
    </section>
    <section class="panel">
      <h2>Commit log</h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </div>

  <section class="panel" style="margin-top:16px">
    <h2>Every engineer</h2>
    <div id="roster"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="sprint-data.js"></script>
<script>
const DEMO = !SPRINT.BOARD_CSV_URL;
const params = new URLSearchParams(location.search);
let period = params.get("period") ? cleanPer(params.get("period")) : "";   // one period at a time
let ROWS=[], ROSTER=[], ALL=null, seenEvents=null, lastUnlocked=null, toastQ=[], toastBusy=false;
document.getElementById("demoTag").hidden=!DEMO;

function showToast(big, small){ toastQ.push([big,small]); if(!toastBusy) nextToast(); }
function nextToast(){
  const t=document.getElementById("toast"), m=toastQ.shift(); if(!m){ toastBusy=false; return; }
  toastBusy=true; t.innerHTML=`${esc(m[0])}${m[1]?`<small>${esc(m[1])}</small>`:""}`; t.classList.add("show");
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(nextToast,500); },3000);
}

async function load(){
  try{
    if(DEMO){ if(!ROWS.length){ const d=demoData(); ROWS=d.rows; ROSTER=loadRoster(d.rosterRows); } }
    else { ROWS=await getCSV(SPRINT.BOARD_CSV_URL); ROSTER=SPRINT.ROSTER_CSV_URL?loadRoster(await getCSV(SPRINT.ROSTER_CSV_URL)):[];
      if(SPRINT.SETTINGS_CSV_URL){ try{ applySettings(await getCSV(SPRINT.SETTINGS_CSV_URL)); }catch(e){} } }
    ALL=computeAll(ROWS, ROSTER);
    document.getElementById("err").style.display="none";
    document.getElementById("dot").classList.remove("off");
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    render();
  }catch(e){
    const el=document.getElementById("err"); el.style.display="block";
    el.textContent="Can't reach the turn-in sheet. Check that the Board tab is published to the web as CSV. Trying again in "+SPRINT.REFRESH_SECONDS+" seconds.";
    document.getElementById("dot").classList.add("off");
  }
}

function fillPeriods(){
  const sel=document.getElementById("periodSel"), pers=periodsOf(ALL);
  /* Goals and rewards are per period, so the board always shows one period. */
  if(!pers.includes(period)) period = pers[0] || "ALL";
  if(sel.options.length!==pers.length){
    sel.innerHTML=pers.map(p=>`<option value="${esc(p)}">Period ${esc(p)}</option>`).join("");
  }
  sel.value=period;
}

function render(){
  fillPeriods();
  const sp=sprintFor(ALL, period);
  const inView = s => period==="ALL" || s.per===period;

  /* hero */
  document.getElementById("pts").textContent=sp.pts.toLocaleString();
  document.getElementById("ptsLbl").textContent = period==="ALL" ? "points this sprint, all periods" : `Period ${period} points this sprint`;
  document.getElementById("onboard").textContent=`${sp.onBoard} / ${sp.size}`;
  const unlockedNow=sp.tiers.filter(t=>t.unlocked).map(t=>t.key);
  const newly = lastUnlocked ? unlockedNow.filter(k=>!lastUnlocked.includes(k)) : [];
  let html="", prev=0;
  sp.tiers.forEach((T,i)=>{
    const seg=Math.max(0,Math.min(1,(sp.pts-prev)/(T.goal-prev)));
    html+=`<div class="wire"><i style="width:${seg*100}%"></i></div>`;
    html+=`<div class="stage ${T.unlocked?"on":""} ${newly.includes(T.key)?"pop":""}">
      <div class="node"><span>${T.unlocked?"✓":i+1}</span></div><div class="nm">${esc(T.name)}</div>
      <div class="goal">${T.goal.toLocaleString()} pts</div><div class="rw">${esc(T.reward)}</div>
      ${T.everyone?`<div class="need">needs every engineer</div>`:""}</div>`;
    prev=T.goal;
  });
  document.getElementById("pipe").innerHTML=html;
  newly.forEach(k=>{ const T=sp.tiers.find(t=>t.key===k); showToast(`${period==="ALL"?"The class":"Period "+period} unlocked ${T.name}!`, T.reward); });
  lastUnlocked=unlockedNow;
  const next=sp.tiers.find(t=>!t.unlocked);
  let msg="Deployed. Every reward unlocked this sprint.";
  if(next) msg = !next.ptsOk ? `${(next.goal-sp.pts).toLocaleString()} points to ${next.name}` : `Points hit! ${sp.size-sp.onBoard} engineers still need a commit to ship ${next.name}.`;
  if(sp.days<5) msg += ` (${sp.days}-day week, goals scaled down)`;
  document.getElementById("nextline").textContent=msg;

  /* last week's winner banner */
  const pers=periodsOf(ALL);
  const banner=document.getElementById("banner");
  if(pers.length>1){
    const lw=pers.map(p=>{ const l=ALL.students.filter(s=>s.per===p); return [p, l.reduce((t,s)=>t+s.lastWeek,0)/Math.max(1,l.length)]; }).sort((a,b)=>b[1]-a[1]);
    if(lw[0][1]>0){ banner.style.display="block"; banner.innerHTML=`Last sprint's winner: <b>Period ${esc(lw[0][0])}</b> with ${Math.round(lw[0][1])} points per engineer.`; }
  } else banner.style.display="none";

  /* tech leads */
  const ranked=sp.list.filter(s=>s.week>0).sort((a,b)=>b.week-a.week||b.total-a.total);
  document.getElementById("leads").innerHTML = ranked.length ? ranked.slice(0,period==="ALL"?5:3).map((s,i)=>`
    <div class="lead ${i===0?"first":""}"><div class="n ${i<3?"medal":""}">${["🥇","🥈","🥉"][i]||i+1}</div><div class="who"><b>${esc(s.name)}</b>
      <span class="lv l${s.level.lv}">L${s.level.lv} ${esc(s.level.title)}</span>${period==="ALL"?` <span style="color:var(--muted);font-size:14px">P${esc(s.per)}</span>`:""}</div>
      <div class="p">${s.week.toLocaleString()}</div></div>`).join("")
    : `<p class="empty">No commits yet this sprint. First one in gets the top spot.</p>`;

  /* race: points per engineer, so period size doesn't matter */
  const raceBox=document.getElementById("raceBox");
  if(pers.length>1){
    const rs=pers.map(p=>{ const s=sprintFor(ALL,p); return [p, Math.round(s.pts/Math.max(1,s.size))]; });
    const max=Math.max(1,...rs.map(r=>r[1])), top=rs.reduce((a,b)=>b[1]>a[1]?b:a)[0];
    document.getElementById("race").innerHTML=rs.map(([p,v])=>`<div class="row ${p===top&&v>0?"top":""}"><div class="lab">P${esc(p)}${p===top&&v>0?" 👑":""}<span style="display:block;font:500 12px var(--mono);color:var(--muted)">on ${esc(currentLessonFor(p))}</span></div><div class="bar"><i style="width:${v/max*100}%"></i></div><div class="v">${v}</div></div>`).join("")+`<div class="note">Points per engineer this sprint</div>`;
  } else document.getElementById("race").innerHTML=`<p class="empty">Race shows when more than one period is on the board.</p>`;

  /* mentors */
  const ms=ALL.students.filter(s=>inView(s)&&s.mentorWeek>0).sort((a,b)=>b.mentorWeek-a.mentorWeek);
  document.getElementById("mentors").innerHTML = ms.length ? ms.slice(0,12).map(s=>`<span class="mchip">${esc(s.name)}<span>×${s.mentorWeek}</span></span>`).join("")
    : `<p class="empty">Help a classmate and get named in the Commit form to show up here.</p>`;

  /* feed + level-up toasts */
  const ev=ALL.events.filter(e=>inView(e));
  const keyOf=e=>+e.t+"|"+e.id+"|"+e.act+"|"+e.type;
  const fresh = seenEvents ? ev.filter(e=>!seenEvents.has(keyOf(e))) : [];
  seenEvents=new Set(ALL.events.map(keyOf));
  fresh.filter(e=>e.levelUp).forEach(e=>{ const L=LEVELS[e.levelUp-1]; showToast(`LEVEL UP! ${e.name}`, `L${L.lv} ${L.title}`); });
  const freshKeys=new Set(fresh.map(keyOf)), freshIds=new Set(fresh.map(e=>e.id));
  const last=ev.slice(-9).reverse();
  document.getElementById("feed").innerHTML = last.length ? last.map(e=>`<li class="${e.type} ${freshKeys.has(keyOf(e))?"new":""}">
      <span><b>${esc(e.name)}</b> ${e.type==="mentor"?`helped ${esc(e.act)}`:`shipped ${esc(e.kind==="standup"?"the Daily Standup":e.act)}`}</span>
      <span class="plus">+${e.pts}</span></li>`).join("")
    : `<li class="empty">Waiting for the first commit.</li>`;

  /* every engineer */
  const groups=new Map();
  sp.list.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{ if(!groups.has(s.per)) groups.set(s.per,[]); groups.get(s.per).push(s); });
  const keys=[...groups.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  document.getElementById("roster").innerHTML=keys.map(k=>`${keys.length>1?`<div class="perHead">Period ${esc(k)}</div>`:""}<div class="roster">${groups.get(k).map(s=>`
    <div class="tile ${s.week?"":"ready"} ${freshIds.has(s.id)?"flash":""}">
      <div class="hx l${s.level.lv}">L${s.level.lv}</div>
      <div class="tx"><div class="nm">${esc(s.name)}<span>${s.week?s.week.toLocaleString():""}</span></div>
      <div class="sub">${s.week?esc(s.level.title):"Ready to ship"}</div></div>
    </div>`).join("")}</div>`).join("");
}

document.getElementById("periodSel").onchange=e=>{
  period=e.target.value; lastUnlocked=null;
  const u=new URL(location); u.searchParams.set("period",period); history.replaceState(null,"",u);
  render();
};

/* Demo: a fake commit every few seconds so you can watch the board move */
function demoTick(){
  if(!ALL) return;
  const pool=ALL.students.filter(s=>period==="ALL"||s.per===period);
  const s=pool[Math.floor(Math.random()*pool.length)];
  const here=lessonIdx(currentLessonFor(s.per));
  const next=ACTS.find(a=>a.k!=="standup" && !s.done.has(a.n) && a.lessonIdx>=here-1 && a.lessonIdx<=here);
  if(!next) return;
  const mates=pool.filter(x=>x.per===s.per&&x.id!==s.id);
  const helper=Math.random()<.3&&mates.length?mates[Math.floor(Math.random()*mates.length)].name:"";
  ROWS.push([new Date().toISOString(), s.name, s.per, next.n, "Pass", helper]);
  ALL=computeAll(ROWS, ROSTER); render();
  document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
}

load();
if(DEMO) setInterval(demoTick, 4000); else setInterval(load, SPRINT.REFRESH_SECONDS*1000);
</script>
</body>
</html>
